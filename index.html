<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dark Ecko — Elemental Valley v0.4.1</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  background:#05070b;
  color:#eafcff;
  font-family:Inter,system-ui,sans-serif;
  overflow:hidden;
}

button,input,select{font:inherit}

#app{
  height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
}

.bar{
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px 12px;
  background:#080c14;
  border-bottom:1px solid #183849;
  z-index:50;
  flex-wrap:wrap;
}

.brand{
  font-weight:850;
  letter-spacing:.1em;
  color:#62e8ff;
  font-size:clamp(12px,2.6vw,16px);
}

.bar label{
  font-size:12px;
  color:#9db5c3;
}

.bar input,
.bar select,
.bar button{
  background:#101925;
  color:#eafcff;
  border:1px solid #24475b;
  border-radius:7px;
  padding:7px 9px;
}

.bar button{
  cursor:pointer;
  border-color:#2fb8d5;
}

.stat{
  margin-left:auto;
  color:#8defff;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}

#viewport{
  position:relative;
  overflow:hidden;
  min-height:0;
  isolation:isolate;
  background:#06101d;
}

.scene{
  position:absolute;
  inset:0;
  pointer-events:none;
}

#sky{
  z-index:1;
  background:
    radial-gradient(circle at 72% 20%,
      #31586c 0 2%,
      #16384c 3% 8%,
      transparent 18%),
    linear-gradient(
      #040a14 0%,
      #071725 48%,
      #0c2527 75%,
      #102a23 100%);
}

#mountains{
  z-index:2;
  top:20%;
  height:43%;
  background-image:
    repeating-linear-gradient(
      150deg,
      transparent 0 120px,
      #102832 121px 220px,
      transparent 221px 330px,
      #153440 331px 470px,
      transparent 471px 610px);
  background-size:900px 100%;
  background-repeat:repeat-x;
}

#farTrees{
  z-index:3;
  top:34%;
  height:31%;
  background-image:
    repeating-linear-gradient(
      100deg,
      transparent 0 45px,
      #10342c 46px 62px,
      transparent 63px 100px);
  background-size:650px 100%;
  background-repeat:repeat-x;
  opacity:.85;
}

#nearTrees{
  z-index:4;
  top:28%;
  height:40%;
  background-image:
    repeating-linear-gradient(
      96deg,
      transparent 0 90px,
      #0b261e 91px 120px,
      transparent 121px 180px);
  background-size:720px 100%;
  background-repeat:repeat-x;
}

#track{
  position:absolute;
  left:0;
  right:0;
  top:57%;
  height:35%;
  z-index:5;
  overflow:hidden;

  background:
    linear-gradient(
      #294038 0 3%,
      #1a2924 3% 88%,
      #101815 88% 100%);

  border-top:3px solid #46d8d8;
  border-bottom:3px solid #17302d;

  box-shadow:inset 0 10px 30px #0005;
}

#trackTexture{
  position:absolute;
  inset:0;

  background-image:
    repeating-linear-gradient(
      90deg,
      transparent 0 145px,
      #ffffff0c 145px 148px,
      transparent 148px 290px);

  background-size:290px 100%;
  background-repeat:repeat-x;
}

#trackLines{
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:2px;

  background-image:
    repeating-linear-gradient(
      90deg,
      #7ad8d2 0 42px,
      transparent 42px 82px);

  background-size:82px 2px;
  background-repeat:repeat-x;
  opacity:.25;
}

#foreground{
  position:absolute;
  left:0;
  right:0;
  top:88%;
  height:15%;
  z-index:30;
  pointer-events:none;

  background-image:
    repeating-linear-gradient(
      105deg,
      transparent 0 65px,
      #071813 66px 91px,
      transparent 92px 145px);

  background-size:430px 100%;
  background-repeat:repeat-x;
}

#racers{
  position:absolute;
  inset:0;
  z-index:20;
  pointer-events:none;
}

.racer{
  position:absolute;
  left:0;
  top:0;

  width:var(--size,28px);
  height:var(--size,28px);

  border-radius:50% 50% 45% 45%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #e7fdff 0 8%,
      #58e8ff 9% 35%,
      #18374d 36% 100%);

  box-shadow:
    0 4px 10px #0009,
    0 0 10px #39ddff55;

  transform-origin:center;
  will-change:transform;
}

.racer:after{
  content:attr(data-n);

  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  font-size:calc(var(--size,28px)*.36);
  font-weight:900;
  color:#031018;
}

.racer.leader{
  outline:2px solid white;

  box-shadow:
    0 4px 10px #0009,
    0 0 18px #fff9;
}

.racer.winner{
  outline:3px solid white;
  filter:brightness(1.3);

  box-shadow:
    0 0 25px #fff,
    0 0 45px #39ddff88;
}

#finish{
  position:absolute;

  top:54%;
  height:41%;
  width:6px;

  z-index:18;

  background:#eaffff;

  box-shadow:
    0 0 12px #44e8ff,
    0 0 30px #44e8ff88;

  pointer-events:none;
  opacity:0;

  will-change:transform,opacity;
}

#finish:before{
  content:"FINISH";

  position:absolute;
  top:-27px;
  left:-38px;

  width:82px;
  text-align:center;

  font-size:10px;
  font-weight:900;
  letter-spacing:.14em;

  color:#bffaff;
  text-shadow:0 0 8px #26d9ff;
}

#finish:after{
  content:"";

  position:absolute;
  top:0;
  left:-8px;

  width:22px;
  height:4px;

  background:#eaffff;
  box-shadow:0 0 10px #26d9ff;
}

.title{
  position:absolute;
  left:4%;
  top:6%;
  z-index:40;

  font-size:clamp(18px,4vw,46px);
  font-weight:900;
  letter-spacing:.08em;

  color:#7ff5ff;
  text-shadow:0 0 18px #26d9ff66;

  pointer-events:none;
}

.subtitle{
  position:absolute;
  left:4%;
  top:15%;
  z-index:40;

  color:#7c9aa7;
  font-size:11px;

  pointer-events:none;
}

#progressWrap{
  position:absolute;

  left:4%;
  right:4%;
  bottom:3%;

  height:5px;
  z-index:40;

  background:#071117;
  border:1px solid #1d4553;

  border-radius:10px;
  overflow:hidden;
}

#progress{
  height:100%;
  width:0%;

  background:
    linear-gradient(
      90deg,
      #36bfdc,
      #b45cff);
}

#debug{
  padding:7px 12px;

  background:#080c14;
  border-top:1px solid #183849;

  color:#809ba8;

  font:11px ui-monospace,monospace;

  display:flex;
  gap:16px;

  white-space:nowrap;
  overflow:auto;
}

.pass{color:#7fffb2}

@media(max-width:650px){

  .bar{
    gap:7px;
    padding:7px 8px;
  }

  .brand{width:100%}

  .stat{margin-left:0}

  .subtitle{display:none}

  #debug{font-size:10px}

  .title{top:3%}
}
</style>
</head>

<body>

<div id="app">

  <div class="bar">

    <div class="brand">
      DARK ECKO // ELEMENTAL VALLEY
    </div>

    <label>
      Racers
      <input
        id="count"
        type="number"
        min="1"
        max="50"
        value="12"
        style="width:60px">
    </label>

    <label>
      Duration
      <select id="duration">
        <option value="5">5s</option>
        <option value="10" selected>10s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
      </select>
    </label>

    <button id="start">Start</button>
    <button id="reset">Reset</button>

    <div id="stat" class="stat">
      READY
    </div>

  </div>


  <div id="viewport">

    <div id="sky" class="scene"></div>
    <div id="mountains" class="scene"></div>
    <div id="farTrees" class="scene"></div>
    <div id="nearTrees" class="scene"></div>

    <div id="track">
      <div id="trackTexture"></div>
      <div id="trackLines"></div>
    </div>

    <div id="racers"></div>

    <div id="finish"></div>

    <div id="foreground"></div>

    <div class="title">
      FOREST RUN
    </div>

    <div class="subtitle">
      v0.4.1 — adaptive pack dynamics
    </div>

    <div id="progressWrap">
      <div id="progress"></div>
    </div>

  </div>


  <div id="debug">

    <span id="clock">
      t=0.000
    </span>

    <span id="logical">
      logical=0
    </span>

    <span id="spread">
      spread=0
    </span>

    <span id="screenSpread">
      screen=0
    </span>

    <span id="mode">
      mode=PACK
    </span>

    <span id="fps">
      fps=—
    </span>

    <span class="pass">
      RESULT LOCKED BEFORE START
    </span>

  </div>

</div>


<script>

const $ =
  s => document.querySelector(s);

const viewport =
  $('#viewport');

const racersEl =
  $('#racers');

const finishEl =
  $('#finish');


/* =========================================
   LOGICAL RACE
========================================= */

const WORLD = 9000;

const START_X = 160;

const FINISH_X = 8780;

const RACE_DISTANCE =
  FINISH_X - START_X;


let raf = 0;

let state = null;


/* =========================================
   HELPERS
========================================= */

function clamp(v,a,b){

  return Math.max(
    a,
    Math.min(b,v)
  );

}

function lerp(a,b,t){

  return a+(b-a)*t;

}

function smoothstep(t){

  t=clamp(t,0,1);

  return t*t*(3-2*t);

}

function smootherstep(t){

  t=clamp(t,0,1);

  return t*t*t*
    (
      t*(t*6-15)+10
    );

}


/* =========================================
   SECURE RNG

   SAME CORE AS v0.4
========================================= */

function secureInt(max){

  if(
    max<=0 ||
    max>0x100000000
  ){
    throw Error('bad max');
  }

  const lim =
    Math.floor(
      0x100000000/max
    )*max;

  const a =
    new Uint32Array(1);

  do{
    crypto.getRandomValues(a);
  }
  while(a[0]>=lim);

  return a[0]%max;

}


/* =========================================
   FISHER-YATES

   SAME CORE AS v0.4
========================================= */

function shuffle(n){

  const a =
    Array.from(
      {length:n},
      (_,i)=>i
    );

  for(
    let i=n-1;
    i>0;
    i--
  ){

    const j =
      secureInt(i+1);

    [a[i],a[j]] =
      [a[j],a[i]];

  }

  return a;

}


/* =========================================
   RACER PRESENTATION
========================================= */

function racerSize(n){

  if(n<=8) return 34;

  if(n<=16) return 29;

  if(n<=30) return 24;

  return 19;

}


function makeRacers(n){

  racersEl.innerHTML='';

  const size =
    racerSize(n);

  for(
    let i=0;
    i<n;
    i++
  ){

    const el =
      document.createElement('div');

    el.className='racer';

    el.dataset.n=i+1;

    el.style.setProperty(
      '--size',
      size+'px'
    );

    racersEl.appendChild(el);

  }

}


/* =========================================
   DEPTH
========================================= */

function trackBounds(
  height,
  size
){

  const top =
    height*.57;

  const bottom =
    height*.92;

  const padding =
    Math.max(
      8,
      size*.6
    );

  return{
    top:top+padding,
    bottom:bottom-padding
  };

}


function depthFor(
  i,
  n,
  seed,
  height,
  size
){

  const bounds =
    trackBounds(
      height,
      size
    );

  if(n===1){

    return(
      bounds.top+
      bounds.bottom
    )/2;

  }

  const slots =
    Math.min(n,14);

  const slot =
    i%slots;

  const base =
    bounds.top+
    (
      bounds.bottom-
      bounds.top
    )*
    (
      slot/
      Math.max(
        1,
        slots-1
      )
    );

  const row =
    Math.floor(
      i/slots
    );

  const stagger =
    row%2
      ? 3
      : -3;

  const jitter =
    (seed-.5)*5;

  return clamp(
    base+
    stagger+
    jitter,

    bounds.top,
    bounds.bottom
  );

}


/* =========================================
   RACE DYNAMICS v0.4.1

   IMPORTANT:

   The locked rank contributes essentially
   nothing during the normal race.

   Racers battle using independent wave
   motion.

   The final result begins asserting itself
   only very late.
========================================= */

function logicalPosition(
  i,
  t
){

  const n =
    state.n;

  const rank =
    state.rank[i];

  const s =
    state.motion[i];


  /*
    Main forward movement.
  */

  const base =
    smoothstep(t);


  /*
    Mid-race activity envelope.

    Strong in the middle.
    Zero at start and finish.
  */

  const activity =
    Math.pow(
      Math.sin(Math.PI*t),
      .82
    );


  /*
    Every racer receives several different
    frequencies and phases.

    This makes lead changes less synchronized
    than the old two-wave system.
  */

  const waveA =
    Math.sin(
      t*s.freqA+
      s.phaseA
    )*s.ampA;


  const waveB =
    Math.sin(
      t*s.freqB+
      s.phaseB
    )*s.ampB;


  const waveC =
    Math.sin(
      t*s.freqC+
      s.phaseC
    )*s.ampC;


  /*
    Slow "form" component.

    A racer can have a good or bad portion
    of the race without it determining the
    actual result.
  */

  const form =
    Math.sin(
      Math.PI*
      (
        t*s.formFreq+
        s.formPhase
      )
    )*
    s.formAmp;


  const drama =
    (
      waveA+
      waveB+
      waveC+
      form
    )*
    activity;


  /*
    RESULT REVEAL

    No rank influence until 91%.

    91–97%:
    begin converging toward the locked order.

    97–100%:
    rapidly resolve exact finish.
  */

  let resultBias=0;


  if(t>.91){

    const reveal =
      smootherstep(
        (t-.91)/.09
      );


    const rankNorm =
      n===1
        ? 1
        : 1-
          rank/(n-1);


    /*
      Winner gets positive final offset.
      Last place gets negative final offset.
    */

    const targetOffset =
      (
        rankNorm-.5
      )*
      Math.min(
        220,
        90+n*2.6
      );


    resultBias =
      targetOffset*
      reveal;

  }


  /*
    As the locked result appears,
    random race drama fades away.
  */

  let dramaFade=1;


  if(t>.91){

    dramaFade =
      1-
      smootherstep(
        (t-.91)/.09
      );

  }


  let x =
    START_X+
    RACE_DISTANCE*
    base+
    drama*
    dramaFade+
    resultBias;


  x =
    clamp(
      x,
      START_X-100,
      FINISH_X+200
    );


  /*
    Exact locked final spatial order.
  */

  if(t>=1){

    const gap =
      Math.min(
        9,
        150/
        Math.max(1,n)
      );


    x =
      FINISH_X+
      (
        n-1-rank
      )*
      gap;

  }


  return x;

}


/* =========================================
   PACK REFERENCE
========================================= */

function packReference(xs){

  const sorted =
    [...xs]
      .sort(
        (a,b)=>a-b
      );


  const median =
    sorted[
      Math.floor(
        sorted.length*.50
      )
    ];


  const p70 =
    sorted[
      Math.floor(
        (
          sorted.length-1
        )*.70
      )
    ];


  return(
    median*.65+
    p70*.35
  );

}


/* =========================================
   ADAPTIVE PACK SCALE

   This is the important 1–50 racer change.

   We calculate the logical spread and
   choose a visual scale that keeps the
   pack readable inside the viewport.
========================================= */

function packScale(
  xs,
  width,
  t
){

  if(xs.length<=1)
    return 1.7;


  const min =
    Math.min(...xs);

  const max =
    Math.max(...xs);

  const spread =
    Math.max(
      1,
      max-min
    );


  /*
    Maximum width occupied by the pack.

    Large fields get slightly more room.
  */

  let allowed =
    width*.58;


  if(xs.length>30)
    allowed=width*.64;


  /*
    Scale needed to fit current spread.
  */

  const fit =
    allowed/spread;


  /*
    Never make normal movement microscopic
    or absurdly exaggerated.
  */

  let scale =
    clamp(
      fit,
      .72,
      1.85
    );


  /*
    During final approach we intentionally
    expand separation slightly.
  */

  if(t>.91){

    const k =
      smootherstep(
        (t-.91)/.09
      );


    scale =
      lerp(
        scale,
        Math.min(
          scale*1.25,
          2.1
        ),
        k
      );

  }


  return scale;

}


/* =========================================
   SCREEN POSITION
========================================= */

function packScreenX(
  worldX,
  reference,
  width,
  scale
){

  const center =
    width*.46;


  return(
    center+
    (
      worldX-reference
    )*
    scale
  );

}


/* =========================================
   ENVIRONMENT
========================================= */

function renderEnvironment(
  logicalProgress
){

  const travel =
    logicalProgress*7200;


  $('#mountains')
    .style.backgroundPositionX =
    `${-travel*.10}px`;


  $('#farTrees')
    .style.backgroundPositionX =
    `${-travel*.25}px`;


  $('#nearTrees')
    .style.backgroundPositionX =
    `${-travel*.52}px`;


  $('#trackTexture')
    .style.backgroundPositionX =
    `${-travel*.95}px`;


  $('#trackLines')
    .style.backgroundPositionX =
    `${-travel*1.05}px`;


  $('#foreground')
    .style.backgroundPositionX =
    `${-travel*1.35}px`;

}


/* =========================================
   FINISH

   Later than v0.4.

   Finish becomes visible at 91%.
========================================= */

function renderFinish(
  t,
  width
){

  const start=.91;


  if(t<start){

    finishEl.style.opacity=0;

    finishEl.style.transform =
      `translate3d(
        ${width+100}px,
        0,
        0
      )`;

    return null;

  }


  const k =
    smootherstep(
      (t-start)/
      (1-start)
    );


  /*
    Starts beyond the right edge.

    Ends around 76% viewport width.
  */

  const startX =
    width+90;


  const endX =
    width*.76;


  const x =
    lerp(
      startX,
      endX,
      k
    );


  finishEl.style.opacity=1;


  finishEl.style.transform =
    `translate3d(
      ${x}px,
      0,
      0
    )`;


  return x;

}


/* =========================================
   RESET
========================================= */

function reset(){

  cancelAnimationFrame(raf);

  state=null;


  const n =
    clamp(
      +$('#count').value||1,
      1,
      50
    );


  $('#count').value=n;


  makeRacers(n);


  const width =
    viewport.clientWidth;


  const height =
    viewport.clientHeight;


  const size =
    racerSize(n);


  [...racersEl.children]
    .forEach(
      (el,i)=>{

        const y =
          depthFor(
            i,
            n,
            .5,
            height,
            size
          );


        const x =
          width*.42+
          (
            (i%5)-2
          )*4;


        const bounds =
          trackBounds(
            height,
            size
          );


        const depth =
          (
            y-bounds.top
          )/
          Math.max(
            1,
            bounds.bottom-
            bounds.top
          );


        const scale =
          .82+
          depth*.28;


        el.style.transform =
          `translate3d(
            ${x-size/2}px,
            ${y-size/2}px,
            0
          )
          scale(${scale})`;


        el.style.zIndex =
          100+
          Math.round(y);


        el.classList.remove(
          'leader',
          'winner'
        );

      }
    );


  renderEnvironment(0);


  finishEl.style.opacity=0;


  $('#progress')
    .style.width='0%';


  $('#stat')
    .textContent='READY';


  $('#clock')
    .textContent='t=0.000';


  $('#logical')
    .textContent='logical=0';


  $('#spread')
    .textContent='spread=0';


  $('#screenSpread')
    .textContent='screen=0';


  $('#mode')
    .textContent='mode=PACK';

}


/* =========================================
   START

   COMPLETE RESULT IS LOCKED HERE,
   BEFORE requestAnimationFrame STARTS.
========================================= */

function start(){

  cancelAnimationFrame(raf);


  const n =
    clamp(
      +$('#count').value||1,
      1,
      50
    );


  const duration =
    +$('#duration').value*
    1000;


  $('#count').value=n;


  makeRacers(n);


  /*
    LOCKED RESULT
  */

  const order =
    shuffle(n);


  const rank =
    Array(n);


  order.forEach(
    (id,index)=>{
      rank[id]=index;
    }
  );


  /*
    Presentation-only motion parameters.

    They are random, but they DO NOT change
    the already locked finishing order.
  */

  const motion =
    Array.from(
      {length:n},
      ()=>({

        freqA:
          10+
          secureInt(7000)/1000,

        freqB:
          23+
          secureInt(10000)/1000,

        freqC:
          41+
          secureInt(15000)/1000,

        phaseA:
          secureInt(6283)/1000,

        phaseB:
          secureInt(6283)/1000,

        phaseC:
          secureInt(6283)/1000,

        ampA:
          50+
          secureInt(46),

        ampB:
          20+
          secureInt(30),

        ampC:
          7+
          secureInt(17),

        formFreq:
          1.1+
          secureInt(1200)/1000,

        formPhase:
          secureInt(2000)/1000,

        formAmp:
          25+
          secureInt(51),

        depthSeed:
          secureInt(1000000)/
          1000000

      })
    );


  state={

    n,

    duration,

    start:
      performance.now(),

    order,

    rank,

    motion,

    positions:
      new Array(n)
        .fill(START_X),

    frames:0,

    lastFps:
      performance.now()

  };


  $('#stat')
    .textContent='RACING';


  raf =
    requestAnimationFrame(frame);

}


/* =========================================
   FRAME
========================================= */

function frame(now){

  if(!state)
    return;


  const t =
    clamp(
      (
        now-state.start
      )/
      state.duration,
      0,
      1
    );


  const width =
    viewport.clientWidth;


  const height =
    viewport.clientHeight;


  const size =
    racerSize(state.n);


  /*
    Calculate logical racer positions.
  */

  for(
    let i=0;
    i<state.n;
    i++
  ){

    state.positions[i] =
      logicalPosition(i,t);

  }


  const reference =
    packReference(
      state.positions
    );


  const logicalProgress =
    clamp(
      (
        reference-
        START_X
      )/
      RACE_DISTANCE,
      0,
      1
    );


  /*
    Determine visual pack scale from
    current logical spread.
  */

  const visualPackScale =
    packScale(
      state.positions,
      width,
      t
    );


  renderEnvironment(
    logicalProgress
  );


  const finishScreenX =
    renderFinish(
      t,
      width
    );


  let leader=-1;

  let leaderX=-Infinity;

  let minWorld=Infinity;

  let maxWorld=-Infinity;

  let minScreen=Infinity;

  let maxScreen=-Infinity;


  [...racersEl.children]
    .forEach(
      (el,i)=>{

        const worldX =
          state.positions[i];


        let screenX =
          packScreenX(
            worldX,
            reference,
            width,
            visualPackScale
          );


        /*
          FINISH TRANSITION

          Until 91%:
          pure pack renderer.

          91–96%:
          finish arrives but pack behavior
          remains dominant.

          96–100%:
          racers become increasingly tied
          to their real distance from the
          finish line.
        */

        if(
          t>.96 &&
          finishScreenX!==null
        ){

          const finishBlend =
            smootherstep(
              (t-.96)/.04
            );


          const distanceToFinish =
            worldX-
            FINISH_X;


          const finishMappedX =
            finishScreenX+
            distanceToFinish*2.35;


          screenX =
            lerp(
              screenX,
              finishMappedX,
              finishBlend
            );

        }


        /*
          Safety margin during normal pack
          mode.

          This affects ONLY rendering.
          Never logical position.
        */

        if(t<.96){

          const margin =
            Math.max(
              size,
              width*.045
            );


          screenX =
            clamp(
              screenX,
              margin,
              width-margin
            );

        }


        const y =
          depthFor(
            i,
            state.n,
            state.motion[i].depthSeed,
            height,
            size
          );


        const bounds =
          trackBounds(
            height,
            size
          );


        const depth =
          (
            y-bounds.top
          )/
          Math.max(
            1,
            bounds.bottom-
            bounds.top
          );


        const visualDepthScale =
          .82+
          depth*.28;


        el.style.transform =
          `translate3d(
            ${screenX-size/2}px,
            ${y-size/2}px,
            0
          )
          scale(${visualDepthScale})`;


        el.style.zIndex =
          100+
          Math.round(y);


        if(worldX>leaderX){

          leaderX=worldX;

          leader=i;

        }


        minWorld =
          Math.min(
            minWorld,
            worldX
          );


        maxWorld =
          Math.max(
            maxWorld,
            worldX
          );


        minScreen =
          Math.min(
            minScreen,
            screenX
          );


        maxScreen =
          Math.max(
            maxScreen,
            screenX
          );

      }
    );


  /*
    Highlight current leader during race.
  */

  [...racersEl.children]
    .forEach(
      (el,i)=>{

        el.classList.toggle(
          'leader',
          t<1 &&
          i===leader
        );


        el.classList.toggle(
          'winner',
          t>=1 &&
          state.rank[i]===0
        );

      }
    );


  $('#progress')
    .style.width =
    `${logicalProgress*100}%`;


  $('#clock')
    .textContent =
    `t=${t.toFixed(3)}`;


  $('#logical')
    .textContent =
    `logical=${
      Math.round(reference)
    }`;


  $('#spread')
    .textContent =
    `spread=${
      Math.round(
        maxWorld-minWorld
      )
    }`;


  $('#screenSpread')
    .textContent =
    `screen=${
      Math.round(
        maxScreen-minScreen
      )
    }`;


  $('#mode')
    .textContent =
    t<.91
      ? 'mode=PACK'
      : t<.96
        ? 'mode=APPROACH'
        : 'mode=FINISH';


  /*
    FPS
  */

  state.frames++;


  if(
    now-
    state.lastFps>
    500
  ){

    const measured =
      Math.round(
        state.frames*
        1000/
        (
          now-
          state.lastFps
        )
      );


    $('#fps')
      .textContent =
      `fps≈${measured}`;


    state.frames=0;

    state.lastFps=now;

  }


  if(t<1){

    const secondsLeft =
      Math.max(
        1,
        Math.ceil(
          (
            1-t
          )*
          state.duration/
          1000
        )
      );


    $('#stat')
      .textContent =
      `${secondsLeft}s`;


    raf =
      requestAnimationFrame(frame);

  }

  else{


    const winner =
      state.rank.indexOf(0)+1;


    $('#stat')
      .textContent =
      `WINNER: #${winner}`;

  }

}


/* =========================================
   CONTROLS
========================================= */

$('#start')
  .onclick=start;


$('#reset')
  .onclick=reset;


$('#count')
  .onchange=reset;


addEventListener(
  'resize',
  ()=>{

    if(!state)
      reset();

  }
);


/* =========================================
   INITIALIZE
========================================= */

reset();

</script>
</body>
</html>
