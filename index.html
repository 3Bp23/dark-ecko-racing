<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Dark Ecko — Elemental Valley v0.4</title>

<style>

*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  background:#05070b;
  color:#eafcff;
  font-family:Inter,system-ui,sans-serif;
  overflow:hidden;
}

button,input,select{font:inherit}

#app{
  height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
}

.bar{
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px 12px;
  background:#080c14;
  border-bottom:1px solid #183849;
  z-index:50;
  flex-wrap:wrap;
}

.brand{
  font-weight:850;
  letter-spacing:.1em;
  color:#62e8ff;
  font-size:clamp(12px,2.6vw,16px);
}

.bar label{
  font-size:12px;
  color:#9db5c3;
}

.bar input,
.bar select,
.bar button{
  background:#101925;
  color:#eafcff;
  border:1px solid #24475b;
  border-radius:7px;
  padding:7px 9px;
}

.bar button{
  cursor:pointer;
  border-color:#2fb8d5;
}

.stat{
  margin-left:auto;
  color:#8defff;
  font-weight:800;
  font-variant-numeric:tabular-nums;
}


/* =========================================
   VIEWPORT
========================================= */

#viewport{
  position:relative;
  overflow:hidden;
  min-height:0;
  isolation:isolate;
  background:#06101d;
}


/* =========================================
   ENVIRONMENT

   These layers remain screen-sized.

   We move their BACKGROUND POSITION rather
   than physically moving the elements.
========================================= */

.scene{
  position:absolute;
  inset:0;
  pointer-events:none;
}


/* sky */

#sky{
  z-index:1;

  background:
    radial-gradient(
      circle at 72% 20%,
      #31586c 0 2%,
      #16384c 3% 8%,
      transparent 18%
    ),
    linear-gradient(
      #040a14 0%,
      #071725 48%,
      #0c2527 75%,
      #102a23 100%
    );
}


/* distant mountains */

#mountains{
  z-index:2;
  top:20%;
  height:43%;

  background-image:
    repeating-linear-gradient(
      150deg,
      transparent 0 120px,
      #102832 121px 220px,
      transparent 221px 330px,
      #153440 331px 470px,
      transparent 471px 610px
    );

  background-size:900px 100%;
  background-repeat:repeat-x;
}


/* distant forest */

#farTrees{
  z-index:3;
  top:34%;
  height:31%;

  background-image:
    repeating-linear-gradient(
      100deg,
      transparent 0 45px,
      #10342c 46px 62px,
      transparent 63px 100px
    );

  background-size:650px 100%;
  background-repeat:repeat-x;

  opacity:.85;
}


/* near forest */

#nearTrees{
  z-index:4;
  top:28%;
  height:40%;

  background-image:
    repeating-linear-gradient(
      96deg,
      transparent 0 90px,
      #0b261e 91px 120px,
      transparent 121px 180px
    );

  background-size:720px 100%;
  background-repeat:repeat-x;
}


/* =========================================
   TRACK

   Screen-space track.
   It no longer needs to be 9000px long.
========================================= */

#track{
  position:absolute;

  left:0;
  right:0;

  top:57%;
  height:35%;

  z-index:5;

  overflow:hidden;

  background:
    linear-gradient(
      #294038 0 3%,
      #1a2924 3% 88%,
      #101815 88% 100%
    );

  border-top:3px solid #46d8d8;
  border-bottom:3px solid #17302d;

  box-shadow:
    inset 0 10px 30px #0005;
}


/*
Moving ground texture.
*/

#trackTexture{
  position:absolute;
  inset:0;

  background-image:
    repeating-linear-gradient(
      90deg,
      transparent 0 145px,
      #ffffff0c 145px 148px,
      transparent 148px 290px
    );

  background-size:290px 100%;
  background-repeat:repeat-x;
}


/*
Moving center markings.
*/

#trackLines{
  position:absolute;

  left:0;
  right:0;

  top:50%;

  height:2px;

  background-image:
    repeating-linear-gradient(
      90deg,
      #7ad8d2 0 42px,
      transparent 42px 82px
    );

  background-size:82px 2px;
  background-repeat:repeat-x;

  opacity:.25;
}


/* =========================================
   FOREGROUND

   Faster than track to exaggerate speed.
========================================= */

#foreground{
  position:absolute;

  left:0;
  right:0;

  top:88%;
  height:15%;

  z-index:30;

  pointer-events:none;

  background-image:
    repeating-linear-gradient(
      105deg,
      transparent 0 65px,
      #071813 66px 91px,
      transparent 92px 145px
    );

  background-size:430px 100%;
  background-repeat:repeat-x;
}


/* =========================================
   RACERS
========================================= */

#racers{
  position:absolute;
  inset:0;

  z-index:20;

  pointer-events:none;
}


.racer{
  position:absolute;

  left:0;
  top:0;

  width:var(--size,28px);
  height:var(--size,28px);

  border-radius:
    50% 50% 45% 45%;

  background:
    radial-gradient(
      circle at 35% 30%,
      #e7fdff 0 8%,
      #58e8ff 9% 35%,
      #18374d 36% 100%
    );

  box-shadow:
    0 4px 10px #0009,
    0 0 10px #39ddff55;

  transform-origin:center;

  will-change:transform;
}


.racer:after{
  content:attr(data-n);

  position:absolute;
  inset:0;

  display:grid;
  place-items:center;

  font-size:
    calc(var(--size,28px)*.36);

  font-weight:900;

  color:#031018;
}


.racer.leader{
  outline:2px solid white;

  box-shadow:
    0 4px 10px #0009,
    0 0 18px #fff9;
}


.racer.winner{
  outline:3px solid white;

  filter:
    brightness(1.3);

  box-shadow:
    0 0 25px #fff,
    0 0 45px #39ddff88;
}


/* =========================================
   FINISH LANDMARK

   Normally off screen.

   During final approach it enters
   from the right.
========================================= */

#finish{
  position:absolute;

  top:54%;
  height:41%;

  width:6px;

  z-index:18;

  background:#eaffff;

  box-shadow:
    0 0 12px #44e8ff,
    0 0 30px #44e8ff88;

  pointer-events:none;

  opacity:0;

  will-change:transform,opacity;
}


#finish:before{
  content:"FINISH";

  position:absolute;

  top:-27px;
  left:-38px;

  width:82px;

  text-align:center;

  font-size:10px;
  font-weight:900;

  letter-spacing:.14em;

  color:#bffaff;

  text-shadow:
    0 0 8px #26d9ff;
}


#finish:after{
  content:"";

  position:absolute;

  top:0;
  left:-8px;

  width:22px;
  height:4px;

  background:#eaffff;

  box-shadow:
    0 0 10px #26d9ff;
}


/* =========================================
   UI
========================================= */

.title{
  position:absolute;

  left:4%;
  top:6%;

  z-index:40;

  font-size:
    clamp(18px,4vw,46px);

  font-weight:900;

  letter-spacing:.08em;

  color:#7ff5ff;

  text-shadow:
    0 0 18px #26d9ff66;

  pointer-events:none;
}


.subtitle{
  position:absolute;

  left:4%;
  top:15%;

  z-index:40;

  color:#7c9aa7;

  font-size:11px;

  pointer-events:none;
}


#progressWrap{
  position:absolute;

  left:4%;
  right:4%;

  bottom:3%;

  height:5px;

  z-index:40;

  background:#071117;

  border:1px solid #1d4553;

  border-radius:10px;

  overflow:hidden;
}


#progress{
  height:100%;
  width:0%;

  background:
    linear-gradient(
      90deg,
      #36bfdc,
      #b45cff
    );
}


/* =========================================
   DEBUG
========================================= */

#debug{
  padding:7px 12px;

  background:#080c14;

  border-top:
    1px solid #183849;

  color:#809ba8;

  font:
    11px ui-monospace,monospace;

  display:flex;

  gap:16px;

  white-space:nowrap;

  overflow:auto;
}


.pass{
  color:#7fffb2;
}


@media(max-width:650px){

  .bar{
    gap:7px;
    padding:7px 8px;
  }

  .brand{
    width:100%;
  }

  .stat{
    margin-left:0;
  }

  .subtitle{
    display:none;
  }

  #debug{
    font-size:10px;
  }

  .title{
    top:3%;
  }

}

</style>
</head>


<body>

<div id="app">


<!-- =====================================
     CONTROLS
===================================== -->

<div class="bar">

  <div class="brand">
    DARK ECKO // ELEMENTAL VALLEY
  </div>

  <label>
    Racers
    <input
      id="count"
      type="number"
      min="1"
      max="50"
      value="12"
      style="width:60px">
  </label>

  <label>
    Duration

    <select id="duration">

      <option value="5">
        5s
      </option>

      <option
        value="10"
        selected>
        10s
      </option>

      <option value="30">
        30s
      </option>

      <option value="60">
        60s
      </option>

    </select>

  </label>

  <button id="start">
    Start
  </button>

  <button id="reset">
    Reset
  </button>

  <div
    id="stat"
    class="stat">
    READY
  </div>

</div>


<!-- =====================================
     RACE VIEWPORT
===================================== -->

<div id="viewport">

  <div
    id="sky"
    class="scene">
  </div>

  <div
    id="mountains"
    class="scene">
  </div>

  <div
    id="farTrees"
    class="scene">
  </div>

  <div
    id="nearTrees"
    class="scene">
  </div>


  <div id="track">

    <div id="trackTexture"></div>

    <div id="trackLines"></div>

  </div>


  <div id="racers"></div>


  <div id="finish"></div>


  <div id="foreground"></div>


  <div class="title">
    FOREST RUN
  </div>

  <div class="subtitle">
    v0.4 — virtual race + pack renderer
  </div>


  <div id="progressWrap">

    <div id="progress"></div>

  </div>

</div>


<!-- =====================================
     DEBUG
===================================== -->

<div id="debug">

  <span id="clock">
    t=0.000
  </span>

  <span id="logical">
    logical=0
  </span>

  <span id="spread">
    spread=0
  </span>

  <span id="mode">
    mode=PACK
  </span>

  <span id="fps">
    fps=—
  </span>

  <span class="pass">
    WORLD=9000 logical units
  </span>

  <span class="pass">
    CSPRNG → locked order → reveal
  </span>

</div>


</div>


<script>

/* =========================================
   DOM
========================================= */

const $ =
  s =>
    document.querySelector(s);


const viewport =
  $('#viewport');

const racersEl =
  $('#racers');

const finishEl =
  $('#finish');


/* =========================================
   LOGICAL WORLD

   WORLD still exists.

   It is no longer literally rendered
   as a 9000px DOM element.
========================================= */

const WORLD = 9000;

const START_X = 160;

const FINISH_X = 8780;

const RACE_DISTANCE =
  FINISH_X - START_X;


/* =========================================
   STATE
========================================= */

let raf = 0;

let state = null;


/* =========================================
   BASIC HELPERS
========================================= */

function clamp(v,a,b){

  return Math.max(
    a,
    Math.min(b,v)
  );

}


function lerp(a,b,t){

  return a +
    (b-a)*t;

}


function smoothstep(t){

  t =
    clamp(t,0,1);

  return t*t*(3-2*t);

}


/* =========================================
   SECURE RNG

   UNCHANGED.
========================================= */

function secureInt(max){

  if(
    max<=0 ||
    max>0x100000000
  ){

    throw Error(
      'bad max'
    );

  }

  const lim =
    Math.floor(
      0x100000000/max
    ) * max;

  const a =
    new Uint32Array(1);

  do{

    crypto.getRandomValues(a);

  }
  while(
    a[0]>=lim
  );

  return a[0]%max;

}


/* =========================================
   FISHER-YATES

   UNCHANGED.
========================================= */

function shuffle(n){

  const a =
    Array.from(
      {length:n},
      (_,i)=>i
    );

  for(
    let i=n-1;
    i>0;
    i--
  ){

    const j =
      secureInt(i+1);

    [a[i],a[j]] =
      [a[j],a[i]];

  }

  return a;

}


/* =========================================
   RACER SIZE
========================================= */

function racerSize(n){

  if(n<=8)
    return 34;

  if(n<=16)
    return 29;

  if(n<=30)
    return 24;

  return 19;

}


/* =========================================
   CREATE RACERS
========================================= */

function makeRacers(n){

  racersEl.innerHTML='';

  const size =
    racerSize(n);

  for(
    let i=0;
    i<n;
    i++
  ){

    const el =
      document.createElement(
        'div'
      );

    el.className =
      'racer';

    el.dataset.n =
      i+1;

    el.style.setProperty(
      '--size',
      size+'px'
    );

    racersEl.appendChild(
      el
    );

  }

}


/* =========================================
   TRACK DEPTH

   Y is purely visual.
========================================= */

function trackBounds(
  height,
  size
){

  const top =
    height*.57;

  const bottom =
    height*.92;

  const padding =
    Math.max(
      8,
      size*.6
    );

  return{

    top:
      top+padding,

    bottom:
      bottom-padding

  };

}


function depthFor(
  i,
  n,
  seed,
  height,
  size
){

  const bounds =
    trackBounds(
      height,
      size
    );

  if(n===1){

    return(
      bounds.top +
      bounds.bottom
    )/2;

  }


  const slots =
    Math.min(
      n,
      14
    );


  const slot =
    i%slots;


  const base =
    bounds.top +
    (
      bounds.bottom -
      bounds.top
    ) *
    (
      slot /
      Math.max(
        1,
        slots-1
      )
    );


  const row =
    Math.floor(
      i/slots
    );


  const stagger =
    row%2
      ? 3
      : -3;


  const jitter =
    (seed-.5)*5;


  return clamp(
    base +
    stagger +
    jitter,

    bounds.top,

    bounds.bottom
  );

}


/* =========================================
   LOGICAL RACER POSITION

   THIS is the actual race.

   Screen movement is derived from this,
   never the other way around.
========================================= */

function logicalPosition(
  i,
  t
){

  const n =
    state.n;

  const rank =
    state.rank[i];

  const seed =
    state.seeds[i];


  /*
    Overall forward progress.
  */

  const base =
    smoothstep(t);


  /*
    Temporary visual/race drama.

    These create overtakes but disappear
    at start and finish.
  */

  const envelope =
    Math.pow(
      Math.sin(
        Math.PI*t
      ),
      1.25
    );


  const surge1 =
    Math.sin(
      t*(13+seed*4) +
      seed*20
    ) * 85;


  const surge2 =
    Math.sin(
      t*(31+seed*8) +
      seed*11
    ) * 34;


  const surge =
    (
      surge1 +
      surge2
    ) *
    envelope;


  /*
    Locked finish order gradually becomes
    visible late in the race.
  */

  const rankNorm =
    n===1
      ? 1
      : 1 -
        rank/(n-1);


  const separation =
    (
      rankNorm-.5
    ) *
    Math.min(
      260,
      90+n*4
    ) *
    Math.pow(
      t,
      6
    );


  let x =
    START_X +
    RACE_DISTANCE *
    base +
    surge +
    separation;


  x =
    clamp(
      x,
      START_X-100,
      FINISH_X+180
    );


  /*
    Exact locked final order.
  */

  if(t>=1){

    const gap =
      Math.min(
        9,
        150 /
        Math.max(
          1,
          n
        )
      );


    x =
      FINISH_X +
      (
        n-1-rank
      ) *
      gap;

  }


  return x;

}


/* =========================================
   PACK CENTER

   The racers' WORLD positions may be
   thousands of units down the course.

   This converts that race into a pack
   centered around the screen.
========================================= */

function packReference(xs){

  const sorted =
    [...xs]
      .sort(
        (a,b)=>a-b
      );


  const median =
    sorted[
      Math.floor(
        sorted.length*.50
      )
    ];


  const p70 =
    sorted[
      Math.floor(
        (
          sorted.length-1
        )*.70
      )
    ];


  return(
    median*.60 +
    p70*.40
  );

}


/* =========================================
   SCREEN PACK POSITION
========================================= */

function packScreenX(
  worldX,
  reference,
  width,
  t
){

  /*
    Pack sits around 46% screen width.
  */

  const center =
    width*.46;


  /*
    Convert logical separation into
    visible racer separation.

    This is intentionally amplified.
  */

  let scale =
    1.55;


  /*
    Near the finish we expand the pack
    slightly so order becomes easier
    to read.
  */

  if(t>.82){

    const k =
      smoothstep(
        (t-.82)/.18
      );

    scale =
      lerp(
        1.55,
        2.15,
        k
      );

  }


  return(
    center +
    (
      worldX -
      reference
    ) *
    scale
  );

}


/* =========================================
   ENVIRONMENT MOVEMENT

   Logical race progress controls how far
   the environment appears to have moved.
========================================= */

function renderEnvironment(
  logicalProgress
){

  /*
    These numbers are deliberately not
    world pixels.

    They are visual travel distances.
  */

  const travel =
    logicalProgress * 7200;


  /*
    Negative movement means environment
    travels left while racers appear
    to travel right.
  */

  $('#mountains')
    .style.backgroundPositionX =
    `${-travel*.10}px`;


  $('#farTrees')
    .style.backgroundPositionX =
    `${-travel*.25}px`;


  $('#nearTrees')
    .style.backgroundPositionX =
    `${-travel*.52}px`;


  $('#trackTexture')
    .style.backgroundPositionX =
    `${-travel*.95}px`;


  $('#trackLines')
    .style.backgroundPositionX =
    `${-travel*1.05}px`;


  $('#foreground')
    .style.backgroundPositionX =
    `${-travel*1.35}px`;

}


/* =========================================
   FINISH APPROACH

   At 88% the finish line starts entering
   from the right.

   By the end it is near 78% screen width.
========================================= */

function renderFinish(
  t,
  width
){

  const start =
    .88;


  if(t<start){

    finishEl.style.opacity =
      0;

    finishEl.style.transform =
      `translate3d(
        ${width+100}px,
        0,
        0
      )`;

    return null;

  }


  const k =
    smoothstep(
      (t-start) /
      (1-start)
    );


  const startX =
    width + 80;


  const endX =
    width*.78;


  const x =
    lerp(
      startX,
      endX,
      k
    );


  finishEl.style.opacity =
    1;


  finishEl.style.transform =
    `translate3d(
      ${x}px,
      0,
      0
    )`;


  return x;

}


/* =========================================
   RESET
========================================= */

function reset(){

  cancelAnimationFrame(
    raf
  );


  state=null;


  const n =
    clamp(
      +$('#count').value || 1,
      1,
      50
    );


  $('#count').value =
    n;


  makeRacers(n);


  const width =
    viewport.clientWidth;


  const height =
    viewport.clientHeight;


  const size =
    racerSize(n);


  [...racersEl.children]
    .forEach(
      (el,i)=>{

        const y =
          depthFor(
            i,
            n,
            .5,
            height,
            size
          );


        const x =
          width*.40 +
          (
            (i%5)-2
          )*4;


        const bounds =
          trackBounds(
            height,
            size
          );


        const depth =
          (
            y -
            bounds.top
          ) /
          Math.max(
            1,
            bounds.bottom -
            bounds.top
          );


        const scale =
          .82 +
          depth*.28;


        el.style.transform =
          `translate3d(
            ${x-size/2}px,
            ${y-size/2}px,
            0
          )
          scale(${scale})`;


        el.style.zIndex =
          100 +
          Math.round(y);


        el.classList.remove(
          'leader',
          'winner'
        );

      }
    );


  renderEnvironment(0);


  finishEl.style.opacity =
    0;


  $('#progress')
    .style.width =
    '0%';


  $('#stat')
    .textContent =
    'READY';


  $('#clock')
    .textContent =
    't=0.000';


  $('#logical')
    .textContent =
    'logical=0';


  $('#spread')
    .textContent =
    'spread=0';


  $('#mode')
    .textContent =
    'mode=PACK';

}


/* =========================================
   START

   RESULT IS LOCKED BEFORE ANIMATION.
========================================= */

function start(){

  cancelAnimationFrame(
    raf
  );


  const n =
    clamp(
      +$('#count').value || 1,
      1,
      50
    );


  const duration =
    +$('#duration').value *
    1000;


  $('#count').value =
    n;


  makeRacers(n);


  /*
    RESULT GENERATED HERE.
  */

  const order =
    shuffle(n);


  const rank =
    Array(n);


  order.forEach(
    (id,index)=>{

      rank[id] =
        index;

    }
  );


  /*
    Visual seeds are independent.
  */

  const seeds =
    Array.from(
      {length:n},
      ()=>
        secureInt(1000000) /
        1000000
    );


  state={

    n,

    duration,

    start:
      performance.now(),

    order,

    rank,

    seeds,

    positions:
      new Array(n)
        .fill(START_X),

    frames:0,

    lastFps:
      performance.now()

  };


  $('#stat')
    .textContent =
    'RACING';


  raf =
    requestAnimationFrame(
      frame
    );

}


/* =========================================
   FRAME
========================================= */

function frame(now){

  if(!state)
    return;


  const t =
    clamp(
      (
        now -
        state.start
      ) /
      state.duration,
      0,
      1
    );


  const width =
    viewport.clientWidth;


  const height =
    viewport.clientHeight;


  const size =
    racerSize(
      state.n
    );


  /*
    Calculate REAL logical positions.
  */

  for(
    let i=0;
    i<state.n;
    i++
  ){

    state.positions[i] =
      logicalPosition(
        i,
        t
      );

  }


  /*
    Determine pack reference.
  */

  const reference =
    packReference(
      state.positions
    );


  /*
    Convert reference position to
    normalized world progress.
  */

  const logicalProgress =
    clamp(
      (
        reference -
        START_X
      ) /
      RACE_DISTANCE,
      0,
      1
    );


  /*
    Environment movement is driven
    by logical race progress.
  */

  renderEnvironment(
    logicalProgress
  );


  /*
    Finish is an environmental landmark.
  */

  const finishScreenX =
    renderFinish(
      t,
      width
    );


  let leader =
    -1;


  let leaderX =
    -Infinity;


  let minX =
    Infinity;


  let maxX =
    -Infinity;


  /*
    Draw racers.
  */

  [...racersEl.children]
    .forEach(
      (el,i)=>{

        const worldX =
          state.positions[i];


        let screenX =
          packScreenX(
            worldX,
            reference,
            width,
            t
          );


        /*
          FINAL APPROACH

          During the final 12%, the finish
          line becomes a real visual target.

          We gradually map racers toward
          their distance from FINISH_X.
        */

        if(
          t>=.88 &&
          finishScreenX!==null
        ){

          const k =
            smoothstep(
              (t-.88)/.12
            );


          const distanceToFinish =
            worldX -
            FINISH_X;


          const finishMappedX =
            finishScreenX +
            distanceToFinish*2.15;


          screenX =
            lerp(
              screenX,
              finishMappedX,
              k
            );

        }


        const y =
          depthFor(
            i,
            state.n,
            state.seeds[i],
            height,
            size
          );


        const bounds =
          trackBounds(
            height,
            size
          );


        const depth =
          (
            y -
            bounds.top
          ) /
          Math.max(
            1,
            bounds.bottom -
            bounds.top
          );


        const visualScale =
          .82 +
          depth*.28;


        el.style.transform =
          `translate3d(
            ${screenX-size/2}px,
            ${y-size/2}px,
            0
          )
          scale(${visualScale})`;


        el.style.zIndex =
          100 +
          Math.round(y);


        if(
          worldX >
          leaderX
        ){

          leaderX =
            worldX;

          leader =
            i;

        }


        minX =
          Math.min(
            minX,
            worldX
          );


        maxX =
          Math.max(
            maxX,
            worldX
          );

      }
    );


  /*
    Leader / winner highlighting.
  */

  [...racersEl.children]
    .forEach(
      (el,i)=>{

        el.classList.toggle(
          'leader',
          t<1 &&
          i===leader
        );


        el.classList.toggle(
          'winner',
          t>=1 &&
          state.rank[i]===0
        );

      }
    );


  /*
    Progress bar.
  */

  $('#progress')
    .style.width =
    `${logicalProgress*100}%`;


  /*
    Debug information.
  */

  $('#clock')
    .textContent =
    `t=${t.toFixed(3)}`;


  $('#logical')
    .textContent =
    `logical=${
      Math.round(
        reference
      )
    }`;


  $('#spread')
    .textContent =
    `spread=${
      Math.round(
        maxX-minX
      )
    }`;


  $('#mode')
    .textContent =
    t<.88
      ? 'mode=PACK'
      : 'mode=FINISH';


  /*
    FPS.
  */

  state.frames++;


  if(
    now -
    state.lastFps >
    500
  ){

    const measured =
      Math.round(
        state.frames *
        1000 /
        (
          now -
          state.lastFps
        )
      );


    $('#fps')
      .textContent =
      `fps≈${measured}`;


    state.frames=0;


    state.lastFps=now;

  }


  /*
    Continue / finish.
  */

  if(t<1){

    const secondsLeft =
      Math.max(
        1,
        Math.ceil(
          (
            1-t
          ) *
          state.duration /
          1000
        )
      );


    $('#stat')
      .textContent =
      `${secondsLeft}s`;


    raf =
      requestAnimationFrame(
        frame
      );

  }
  else{


    const winner =
      state.rank
        .indexOf(0)+1;


    $('#stat')
      .textContent =
      `WINNER: #${winner}`;

  }

}


/* =========================================
   CONTROLS
========================================= */

$('#start')
  .onclick =
  start;


$('#reset')
  .onclick =
  reset;


$('#count')
  .onchange =
  reset;


addEventListener(
  'resize',
  ()=>{

    if(!state){

      reset();

    }

  }
);


/* =========================================
   INITIALIZE
========================================= */

reset();

</script>

</body>
</html>
