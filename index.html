<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dark Ecko — Elemental Valley v0.3.1</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  height:100%;
  background:#05070b;
  color:#eafcff;
  font-family:Inter,system-ui,sans-serif;
  overflow:hidden;
}

button,input,select{font:inherit}

#app{
  height:100%;
  display:grid;
  grid-template-rows:auto 1fr auto;
}

.bar{
  display:flex;
  gap:10px;
  align-items:center;
  padding:9px 12px;
  background:#080c14;
  border-bottom:1px solid #183849;
  z-index:30;
  flex-wrap:wrap;
}

.brand{
  font-weight:850;
  letter-spacing:.1em;
  color:#62e8ff;
  font-size:clamp(12px,2.6vw,16px);
}

.bar label{
  font-size:12px;
  color:#9db5c3;
}

.bar input,
.bar select,
.bar button{
  background:#101925;
  color:#eafcff;
  border:1px solid #24475b;
  border-radius:7px;
  padding:7px 9px;
}

.bar button{
  cursor:pointer;
  border-color:#2fb8d5;
}

.stat{
  margin-left:auto;
  font-variant-numeric:tabular-nums;
  color:#8defff;
  font-weight:700;
}

#viewport{
  position:relative;
  overflow:hidden;
  isolation:isolate;
  min-height:0;
  background:linear-gradient(#06101d 0 55%,#0c1612 55%);
}

/* -------------------------
   PARALLAX SCENERY
------------------------- */

.layer{
  position:absolute;
  inset:0;
  pointer-events:none;
  will-change:transform;
}

.sky{
  background:
    radial-gradient(circle at 72% 24%,#164965 0 3%,transparent 17%),
    linear-gradient(#06101d,#0b2631 68%,#16312b);
}

.mountains{
  top:17%;
  height:48%;
  width:180%;
  background:
    repeating-linear-gradient(
      150deg,
      transparent 0 120px,
      #142e38 121px 210px,
      transparent 211px 300px,
      #183845 301px 430px,
      transparent 431px 560px
    );
  opacity:.9;
}

.farTrees{
  top:35%;
  height:31%;
  width:220%;
  background:
    repeating-linear-gradient(
      100deg,
      transparent 0 48px,
      #10352d 49px 63px,
      transparent 64px 100px
    );
  opacity:.82;
}

.nearTrees{
  top:27%;
  height:42%;
  width:260%;
  background:
    repeating-linear-gradient(
      96deg,
      transparent 0 120px,
      #0c271f 121px 151px,
      transparent 152px 225px
    );
  opacity:.95;
}

/* -------------------------
   PHYSICAL WORLD

   This is the important
   v0.3.1 change.

   Course, gates and racers
   all share WORLD coordinates.
------------------------- */

#world{
  position:absolute;
  left:0;
  top:0;
  width:9000px;
  height:100%;
  z-index:5;
  pointer-events:none;
  will-change:transform;
}

/* Physical race surface */
.track{
  position:absolute;
  left:0;
  top:57%;
  width:9000px;
  height:35%;
  background:
    linear-gradient(
      #2a4039 0 3%,
      #1b2925 3% 88%,
      #101815 88% 100%
    );
  border-top:3px solid #46d8d8;
  border-bottom:3px solid #17302d;
  box-shadow:
    inset 0 10px 30px #0004;
}

/* Longitudinal visual texture */
.track:before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 160px,
      #ffffff08 160px 163px,
      transparent 163px 320px
    );
}

/* Center dashed guide */
.track:after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  top:50%;
  height:2px;
  background:
    repeating-linear-gradient(
      90deg,
      #7ad8d2 0 44px,
      transparent 44px 82px
    );
  opacity:.22;
}

.rail{
  position:absolute;
  left:0;
  width:9000px;
  height:2px;
  background:#74e6e044;
  box-shadow:0 0 8px #46d8d844;
}

.rail.top{
  top:calc(57% + 3.5%);
}

.rail.bottom{
  top:calc(92% - 3.5%);
}

/* -------------------------
   WORLD LANDMARKS
------------------------- */

.gate{
  position:absolute;
  top:57%;
  height:35%;
  width:5px;
  background:#7ff5ff;
  box-shadow:
    0 0 14px #26d9ff,
    0 0 30px #26d9ff55;
  z-index:7;
}

.gate:before{
  content:"";
  position:absolute;
  top:0;
  left:-8px;
  width:21px;
  height:4px;
  background:#b8fbff;
  box-shadow:0 0 10px #26d9ff;
}

.gate:after{
  position:absolute;
  top:-27px;
  left:-38px;
  width:80px;
  text-align:center;
  font-size:10px;
  font-weight:900;
  letter-spacing:.12em;
  color:#b8fbff;
  text-shadow:0 0 8px #26d9ff;
}

.gate.start{
  left:160px;
}

.gate.finish{
  left:8780px;
}

.gate.start:after{
  content:"START";
}

.gate.finish:after{
  content:"FINISH";
}

/* World distance markers */
.marker{
  position:absolute;
  top:54%;
  transform:translateX(-50%);
  color:#6c9ba3;
  font-size:10px;
  letter-spacing:.08em;
  opacity:.75;
}

.marker:after{
  content:"";
  display:block;
  margin:4px auto 0;
  width:1px;
  height:18px;
  background:#4ca3a355;
}

/* -------------------------
   RACERS
------------------------- */

#racers{
  position:absolute;
  inset:0;
  z-index:12;
  pointer-events:none;
}

.racer{
  position:absolute;
  left:0;
  top:0;
  width:var(--size,28px);
  height:var(--size,28px);
  border-radius:50% 50% 45% 45%;
  background:
    radial-gradient(
      circle at 35% 30%,
      #e7fdff 0 8%,
      #58e8ff 9% 35%,
      #18374d 36% 100%
    );
  box-shadow:
    0 4px 10px #0009,
    0 0 10px #39ddff55;
  will-change:transform;
  transform-origin:center;
}

.racer:after{
  content:attr(data-n);
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  font-size:calc(var(--size,28px)*.36);
  font-weight:900;
  color:#031018;
}

.racer.leader{
  outline:2px solid #fff;
  box-shadow:
    0 4px 10px #0009,
    0 0 18px #fff9;
}

.racer.winner{
  outline:3px solid #fff;
  filter:brightness(1.25);
  box-shadow:
    0 0 25px #fff,
    0 0 45px #39ddff88;
}

/* -------------------------
   SCREEN-SPACE UI
------------------------- */

.title{
  position:absolute;
  left:4%;
  top:6%;
  z-index:15;
  font-size:clamp(18px,4vw,46px);
  font-weight:900;
  letter-spacing:.08em;
  color:#7ff5ff;
  text-shadow:0 0 18px #26d9ff66;
  pointer-events:none;
}

.hint{
  position:absolute;
  right:3%;
  top:6%;
  z-index:15;
  color:#7c9aa7;
  font-size:11px;
  text-align:right;
  pointer-events:none;
}

.foreground{
  top:89%;
  height:16%;
  width:300%;
  background:
    repeating-linear-gradient(
      105deg,
      transparent 0 75px,
      #0a1c17 76px 98px,
      transparent 99px 145px
    );
  z-index:20;
}

#debug{
  padding:7px 12px;
  background:#080c14;
  border-top:1px solid #183849;
  color:#809ba8;
  font:11px ui-monospace,monospace;
  display:flex;
  gap:16px;
  white-space:nowrap;
  overflow:auto;
}

.pass{
  color:#7fffb2;
}

@media(max-width:650px){

  .bar{
    gap:7px;
    padding:7px 8px;
  }

  .brand{
    width:100%;
  }

  .stat{
    margin-left:0;
  }

  .hint{
    display:none;
  }

  #debug{
    font-size:10px;
  }

  .title{
    top:3%;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="bar">

    <div class="brand">
      DARK ECKO // ELEMENTAL VALLEY
    </div>

    <label>
      Racers
      <input
        id="count"
        type="number"
        min="1"
        max="50"
        value="12"
        style="width:60px">
    </label>

    <label>
      Duration
      <select id="duration">
        <option value="5">5s</option>
        <option value="10" selected>10s</option>
        <option value="30">30s</option>
        <option value="60">60s</option>
      </select>
    </label>

    <button id="start">
      Start
    </button>

    <button id="reset">
      Reset
    </button>

    <div
      class="stat"
      id="stat">
      READY
    </div>

  </div>

  <div id="viewport">

    <!-- SCREEN / PARALLAX SPACE -->

    <div class="layer sky"></div>

    <div
      class="layer mountains"
      data-depth=".12">
    </div>

    <div
      class="layer farTrees"
      data-depth=".28">
    </div>

    <div
      class="layer nearTrees"
      data-depth=".55">
    </div>


    <!--
      PHYSICAL WORLD SPACE

      Everything inside this container
      uses the same 9000-unit X axis.
    -->

    <div id="world">

      <div class="track"></div>

      <div class="rail top"></div>
      <div class="rail bottom"></div>

      <div class="gate start"></div>
      <div class="gate finish"></div>

      <div
        class="marker"
        style="left:1800px">
        20%
      </div>

      <div
        class="marker"
        style="left:3600px">
        40%
      </div>

      <div
        class="marker"
        style="left:5400px">
        60%
      </div>

      <div
        class="marker"
        style="left:7200px">
        80%
      </div>

      <div id="racers"></div>

    </div>


    <!-- SCREEN UI -->

    <div class="title">
      FOREST RUN
    </div>

    <div class="hint">
      v0.3.1 — unified world coordinates<br>
      result locked before animation
    </div>

    <div
      class="layer foreground"
      data-depth="1.25">
    </div>

  </div>


  <div id="debug">

    <span id="clock">
      t=0.000
    </span>

    <span id="camera">
      camera=0
    </span>

    <span id="spread">
      spread=0
    </span>

    <span id="fps">
      fps=—
    </span>

    <span class="pass">
      WORLD=9000
    </span>

    <span class="pass">
      CSPRNG → locked order → animation
    </span>

  </div>

</div>


<script>

const $ = s =>
  document.querySelector(s);

const racersEl =
  $('#racers');

const viewport =
  $('#viewport');

const worldEl =
  $('#world');


/* =================================
   WORLD CONSTANTS
================================= */

const WORLD = 9000;

const START_X = 160;

const FINISH_X = 8780;


/* =================================
   STATE
================================= */

let raf = 0;

let state = null;


/* =================================
   HELPERS
================================= */

function clamp(v,a,b){

  return Math.max(
    a,
    Math.min(b,v)
  );

}

function smoothstep(t){

  t =
    clamp(t,0,1);

  return t*t*(3-2*t);

}


/* =================================
   CRYPTOGRAPHIC RNG
================================= */

function secureInt(max){

  if(
    max <= 0 ||
    max > 0x100000000
  ){
    throw Error(
      'bad max'
    );
  }

  const lim =
    Math.floor(
      0x100000000 / max
    ) * max;

  const a =
    new Uint32Array(1);

  do{

    crypto.getRandomValues(a);

  }
  while(
    a[0] >= lim
  );

  return a[0] % max;

}


/* =================================
   UNBIASED FISHER-YATES
================================= */

function shuffle(n){

  const a =
    Array.from(
      {length:n},
      (_,i)=>i
    );

  for(
    let i=n-1;
    i>0;
    i--
  ){

    const j =
      secureInt(i+1);

    [a[i],a[j]] =
      [a[j],a[i]];

  }

  return a;

}


/* =================================
   RACER DISPLAY
================================= */

function racerSize(n){

  if(n<=8)
    return 32;

  if(n<=16)
    return 28;

  if(n<=30)
    return 23;

  return 19;

}


function makeRacers(n){

  racersEl.innerHTML='';

  const size =
    racerSize(n);

  for(
    let i=0;
    i<n;
    i++
  ){

    const el =
      document.createElement(
        'div'
      );

    el.className =
      'racer';

    el.dataset.n =
      i+1;

    el.style.setProperty(
      '--size',
      size+'px'
    );

    racersEl.appendChild(
      el
    );

  }

}


/* =================================
   TRACK DEPTH

   Y is presentation only.
   It NEVER affects race result.
================================= */

function trackBounds(
  h,
  size
){

  const top =
    h*.57;

  const bottom =
    h*.92;

  const pad =
    Math.max(
      8,
      size*.6
    );

  return{
    top:
      top+pad,

    bottom:
      bottom-pad
  };

}


function depthFor(
  i,
  n,
  seed,
  h,
  size
){

  const bounds =
    trackBounds(
      h,
      size
    );

  if(n===1){

    return(
      bounds.top +
      bounds.bottom
    ) / 2;

  }

  /*
    Up to 14 visual depth rows.

    More than 14 racers wrap
    into a second/third pack.
  */

  const slots =
    Math.min(
      n,
      14
    );

  const slot =
    i % slots;

  const base =
    bounds.top +
    (
      bounds.bottom -
      bounds.top
    ) *
    (
      slot /
      Math.max(
        1,
        slots-1
      )
    );

  const row =
    Math.floor(
      i / slots
    );

  const stagger =
    (
      row % 2
        ? 3
        : -3
    );

  const jitter =
    (
      seed-.5
    ) *
    5;

  return clamp(
    base +
    stagger +
    jitter,
    bounds.top,
    bounds.bottom
  );

}


/* =================================
   CAMERA / PARALLAX
================================= */

function setCamera(
  cameraX
){

  /*
    PHYSICAL WORLD:
    exactly 1:1 camera movement.
  */

  worldEl.style.transform =
    `translate3d(
      ${-cameraX}px,
      0,
      0
    )`;


  /*
    SCENERY:
    depth-based parallax.
  */

  document
    .querySelectorAll(
      '.layer[data-depth]'
    )
    .forEach(
      el=>{

        const depth =
          +el.dataset.depth;

        el.style.transform =
          `translate3d(
            ${-cameraX*depth}px,
            0,
            0
          )`;

      }
    );

}


/* =================================
   RESET
================================= */

function reset(){

  cancelAnimationFrame(
    raf
  );

  state=null;

  const n =
    clamp(
      +$('#count').value || 1,
      1,
      50
    );

  $('#count').value =
    n;

  makeRacers(n);

  setCamera(0);

  const h =
    viewport.clientHeight;

  const size =
    racerSize(n);

  [...racersEl.children]
    .forEach(
      (el,i)=>{

        const y =
          depthFor(
            i,
            n,
            .5,
            h,
            size
          );

        /*
          Racers begin physically
          near the START line.
        */

        const x =
          START_X -
          55 -
          (i%5)*5;

        el.classList.remove(
          'leader',
          'winner'
        );

        el.style.transform =
          `translate3d(
            ${x-size/2}px,
            ${y-size/2}px,
            0
          )
          scale(1)`;

        el.style.zIndex =
          100 +
          Math.round(y);

      }
    );

  $('#stat')
    .textContent =
    'READY';

  $('#clock')
    .textContent =
    't=0.000';

  $('#camera')
    .textContent =
    'camera=0';

  $('#spread')
    .textContent =
    'spread=0';

}


/* =================================
   START RACE
================================= */

function start(){

  cancelAnimationFrame(
    raf
  );

  const n =
    clamp(
      +$('#count').value || 1,
      1,
      50
    );

  const duration =
    +$('#duration').value *
    1000;

  $('#count').value =
    n;

  makeRacers(n);


  /*
    THE RESULT IS CREATED HERE.

    Animation has not started yet.
  */

  const order =
    shuffle(n);

  const rank =
    Array(n);

  order.forEach(
    (id,index)=>{

      rank[id] =
        index;

    }
  );


  /*
    Separate visual seeds.

    These affect only the
    appearance of the race.
  */

  const seeds =
    Array.from(
      {length:n},
      ()=>
        secureInt(1000000) /
        1000000
    );


  state={

    n,

    duration,

    start:
      performance.now(),

    order,

    rank,

    seeds,

    cameraX:0,

    positions:
      new Array(n)
        .fill(START_X),

    frames:0,

    lastFps:
      performance.now()

  };


  $('#stat')
    .textContent =
    'RACING';


  raf =
    requestAnimationFrame(
      frame
    );

}


/* =================================
   RACER WORLD POSITION
================================= */

function racePosition(
  i,
  t
){

  const n =
    state.n;

  const rank =
    state.rank[i];

  const seed =
    state.seeds[i];


  /*
    Main course progression.
  */

  const base =
    smoothstep(t);


  /*
    Visual surges.

    Large enough to cause
    temporary lead changes.

    They fade to ZERO at
    both start and finish.
  */

  const envelope =
    Math.pow(
      Math.sin(
        Math.PI*t
      ),
      1.25
    );

  const surge1 =
    Math.sin(
      t*(13+seed*4) +
      seed*20
    ) * 85;

  const surge2 =
    Math.sin(
      t*(31+seed*8) +
      seed*11
    ) * 34;

  const visualSurge =
    (
      surge1 +
      surge2
    ) *
    envelope;


  /*
    Predetermined rank begins
    becoming visible late.

    This does NOT select the
    winner. The winner was
    already selected above.
  */

  const rankNorm =
    n===1
      ? 1
      : 1 -
        rank/(n-1);

  const separation =
    (
      rankNorm-.5
    ) *
    Math.min(
      260,
      90+n*4
    ) *
    Math.pow(
      t,
      6
    );


  let x =
    START_X +
    (
      FINISH_X -
      START_X
    ) *
    base +
    visualSurge +
    separation;


  /*
    Never allow presentation
    movement to leave the
    physical course.
  */

  x =
    clamp(
      x,
      START_X-100,
      FINISH_X+180
    );


  /*
    Exact deterministic
    final placement.

    Winner crosses farthest,
    followed in locked order.
  */

  if(t>=1){

    const finishGap =
      Math.min(
        9,
        150 /
        Math.max(
          1,
          n
        )
      );

    x =
      FINISH_X +
      (
        n-1-rank
      ) *
      finishGap;

  }


  return x;

}


/* =================================
   PACK CAMERA
================================= */

function desiredCamera(
  xs,
  viewportWidth,
  t
){

  const sorted =
    [...xs]
      .sort(
        (a,b)=>a-b
      );

  const median =
    sorted[
      Math.floor(
        sorted.length*.50
      )
    ];

  const p70 =
    sorted[
      Math.floor(
        (
          sorted.length-1
        )*.70
      )
    ];

  const leader =
    sorted[
      sorted.length-1
    ];


  /*
    Normal race:
    follow the body of the pack.
  */

  let focus =
    median*.58 +
    p70*.42;


  /*
    Last 18%:
    smoothly bias toward
    the leaders.
  */

  if(t>.82){

    const k =
      smoothstep(
        (t-.82)/.18
      );

    focus =
      focus*(1-k) +
      leader*k;

  }


  /*
    Where the focus should
    appear on the screen.
  */

  let screenTarget =
    viewportWidth*.48;


  /*
    At the beginning, show
    more course ahead.
  */

  if(t<.08){

    screenTarget =
      viewportWidth*.34;

  }


  /*
    At the finish, keep the
    finish line and racers
    comfortably visible.
  */

  if(t>.90){

    const k =
      smoothstep(
        (t-.90)/.10
      );

    screenTarget =
      viewportWidth *
      (
        .48 +
        .20*k
      );

  }


  const maxCamera =
    Math.max(
      0,
      WORLD -
      viewportWidth
    );


  return clamp(
    focus -
    screenTarget,
    0,
    maxCamera
  );

}


/* =================================
   ANIMATION FRAME
================================= */

function frame(now){

  if(!state)
    return;


  const t =
    clamp(
      (
        now -
        state.start
      ) /
      state.duration,
      0,
      1
    );


  const width =
    viewport.clientWidth;

  const height =
    viewport.clientHeight;

  const size =
    racerSize(
      state.n
    );


  /*
    First calculate all racers
    in WORLD coordinates.
  */

  for(
    let i=0;
    i<state.n;
    i++
  ){

    state.positions[i] =
      racePosition(
        i,
        t
      );

  }


  /*
    Camera is derived from
    actual racer positions.
  */

  const targetCamera =
    desiredCamera(
      state.positions,
      width,
      t
    );


  /*
    Smooth camera pursuit.
  */

  const follow =
    t<.02
      ? 1
      : .12;

  state.cameraX +=
    (
      targetCamera -
      state.cameraX
    ) *
    follow;


  if(t>=1){

    state.cameraX =
      targetCamera;

  }


  setCamera(
    state.cameraX
  );


  let leader =
    -1;

  let leaderX =
    -Infinity;

  let minX =
    Infinity;

  let maxX =
    -Infinity;


  [...racersEl.children]
    .forEach(
      (el,i)=>{

        const worldX =
          state.positions[i];

        const y =
          depthFor(
            i,
            state.n,
            state.seeds[i],
            height,
            size
          );


        /*
          Because racers live INSIDE
          #world, their X position is
          their actual world position.

          We do NOT subtract cameraX
          here anymore.

          The entire world container
          is translated by cameraX.
        */

        const bounds =
          trackBounds(
            height,
            size
          );

        const depth =
          (
            y -
            bounds.top
          ) /
          Math.max(
            1,
            bounds.bottom -
            bounds.top
          );

        const scale =
          .82 +
          depth*.28;


        el.style.transform =
          `translate3d(
            ${worldX-size/2}px,
            ${y-size/2}px,
            0
          )
          scale(${scale})`;


        el.style.zIndex =
          100 +
          Math.round(y);


        if(
          worldX >
          leaderX
        ){

          leaderX =
            worldX;

          leader =
            i;

        }


        minX =
          Math.min(
            minX,
            worldX
          );

        maxX =
          Math.max(
            maxX,
            worldX
          );

      }
    );


  /*
    Leader highlight.
  */

  [...racersEl.children]
    .forEach(
      (el,i)=>{

        el.classList.toggle(
          'leader',
          t<1 &&
          i===leader
        );

        el.classList.toggle(
          'winner',
          t>=1 &&
          state.rank[i]===0
        );

      }
    );


  /* -------------------------
     DEBUG / PERFORMANCE
  ------------------------- */

  state.frames++;


  if(
    now -
    state.lastFps >
    500
  ){

    const measuredFps =
      Math.round(
        state.frames *
        1000 /
        (
          now -
          state.lastFps
        )
      );

    $('#fps')
      .textContent =
      `fps≈${measuredFps}`;

    state.frames=0;

    state.lastFps=now;

  }


  $('#clock')
    .textContent =
    `t=${t.toFixed(3)}`;


  $('#camera')
    .textContent =
    `camera=${
      Math.round(
        state.cameraX
      )
    }`;


  $('#spread')
    .textContent =
    `spread=${
      Math.round(
        maxX-minX
      )
    }`;


  /* -------------------------
     CONTINUE / FINISH
  ------------------------- */

  if(t<1){

    const secondsLeft =
      Math.max(
        1,
        Math.ceil(
          (
            1-t
          ) *
          state.duration /
          1000
        )
      );

    $('#stat')
      .textContent =
      `${secondsLeft}s`;


    raf =
      requestAnimationFrame(
        frame
      );

  }
  else{

    const winner =
      state.rank
        .indexOf(0) + 1;


    $('#stat')
      .textContent =
      `WINNER: #${winner}`;

  }

}


/* =================================
   CONTROLS
================================= */

$('#start').onclick =
  start;


$('#reset').onclick =
  reset;


$('#count').onchange =
  reset;


addEventListener(
  'resize',
  ()=>{

    if(!state){

      reset();

    }

  }
);


/* =================================
   INITIALIZE
================================= */

reset();

</script>

</body>
</html>
